name: "Домашнее меню — бот"
version: "1.2.0"
slug: menu_bot
image: "ghcr.io/cortesovich/menu-bot-{arch}"
description: "Телеграм-бот домашнего меню: жена выбирает кухню и блюдо, владельцу приходит название и список ингредиентов."
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: false
options:
  bot_token: ""
  owner_id: 0
  allowed_ids: []
  menu_url: ""
  photo_base_url: ""
schema:
  bot_token: password
  owner_id: int
  allowed_ids:
    - int
  menu_url: "str?"
  photo_base_url: "str?"
